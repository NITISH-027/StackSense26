<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackSense - Tech Stack Recommendation Engine</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#e6edf3; --mut:#8b949e; --acc:#2f81f7; --ok:#3fb950; --warn:#d29922; --crit:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:18px 28px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  .badge { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--border); color:var(--mut); }
  .badge.det { color:var(--ok); border-color:var(--ok); }
  main { display:grid; grid-template-columns:minmax(340px,460px) 1fr; gap:20px; padding:20px 28px; align-items:start; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
  fieldset { background:var(--card); border:1px solid var(--border); border-radius:8px; margin:0 0 14px; padding:12px 14px; }
  legend { font-weight:600; color:var(--acc); padding:0 6px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 2px; }
  input[type=text],input[type=number],select,textarea { width:100%; background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font:inherit; }
  textarea { min-height:120px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .checks { display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:6px; }
  .checks label { margin:0; color:var(--fg); display:flex; gap:5px; align-items:center; font-size:13px; }
  .checks input { width:auto; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:9px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--fg); font-weight:400; padding:7px 12px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .layer { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); }
  .just { color:var(--fg); margin:6px 0; }
  .meta { font-size:12px; color:var(--mut); }
  .meta code { background:#0d1117; padding:1px 5px; border-radius:4px; }
  ul { margin:6px 0; padding-left:18px; }
  li { margin:2px 0; }
  .status { font-size:13px; font-weight:700; padding:4px 12px; border-radius:20px; }
  .status.ok { color:var(--ok); border:1px solid var(--ok); }
  .status.ok_with_warnings { color:var(--warn); border:1px solid var(--warn); }
  .status.infeasible,.status.invalid_input { color:var(--crit); border:1px solid var(--crit); }
  .warn { border-left:3px solid var(--warn); padding:6px 10px; background:#1c1912; margin:6px 0; font-size:13px; }
  .warn.critical { border-left-color:var(--crit); background:#2a1214; }
  .warn.info { border-left-color:var(--acc); background:#101c2c; }
  pre { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; font-size:12px; max-height:520px; }
  .cost { font-size:22px; font-weight:700; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>StackSense</h1>
  <span class="badge det">Deterministic rules engine</span>
  <span class="badge">No LLM calls - LLM switch: OFF (only mode)</span>
  <span class="badge">engine v1.0.0</span>
</header>
<main>
  <section>
    <div class="toolbar">
      <select id="preset">
        <option value="">Load a bundled scenario...</option>
        <option value="P1">P1 - Portfolio + blog</option>
        <option value="P2">P2 - Home-services marketplace (India)</option>
        <option value="P3">P3 - Realtime whiteboard SaaS</option>
        <option value="P4">P4 - Digital lending (India)</option>
        <option value="P5">P5 - Internal HR tracker</option>
        <option value="P6">P6 - Offline crop survey</option>
        <option value="test/edge_missing_fields">Edge - missing required fields</option>
        <option value="test/edge_invalid_values">Edge - invalid values</option>
        <option value="test/edge_scale_zero_budget">Edge - huge scale, $0 budget</option>
        <option value="test/edge_airgapped_bank">Edge - air-gapped bank</option>
        <option value="test/edge_tiny_internal_tool">Edge - tiny internal tool</option>
        <option value="test/edge_deprecated_legacy">Edge - deprecated existing systems</option>
      </select>
      <button class="ghost" id="loadPreset">Load</button>
      <button class="ghost" id="loadFile">Open .json file</button>
      <input type="file" id="fileInput" accept=".json" class="hidden">
    </div>
    <label>Scenario JSON (edit, then recommend)</label>
    <textarea id="scenarioText" spellcheck="false"></textarea>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button id="run">Recommend stack</button>
      <button class="ghost" id="downloadBtn">Download output JSON</button>
    </div>
  </section>
  <section id="result"><div class="card meta">Run a scenario to see the recommendation.</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
let lastOutput = null;

$("loadPreset").onclick = async () => {
  const id = $("preset").value; if (!id) return;
  const r = await fetch("/api/scenario/" + id);
  $("scenarioText").value = JSON.stringify(await r.json(), null, 2);
};
$("loadFile").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => $("scenarioText").value = t);
};
$("downloadBtn").onclick = () => {
  if (!lastOutput) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(lastOutput, null, 2)], {type:"application/json"}));
  a.download = (lastOutput.scenario_id || "adhoc") + "_output.json";
  a.click();
};

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function componentCard(layer, c){
  const alts = (c.alternatives||[]).map(a => `<li><b>${esc(a.choice)}</b> - ${esc(a.why_not)}</li>`).join("");
  const trades = (c.tradeoffs||[]).map(t => `<li>${esc(t)}</li>`).join("");
  return `<div class="card">
    <div class="layer">${esc(layer)}</div>
    <h3>${esc(c.choice)}</h3>
    <div class="just">${esc(c.justification)}</div>
    <div class="meta">Driven by: ${(c.driven_by||[]).map(d=>`<code>${esc(d)}</code>`).join(" ")}</div>
    ${alts ? `<div class="meta" style="margin-top:6px">Alternatives considered:<ul>${alts}</ul></div>` : ""}
    ${trades ? `<div class="meta" style="margin-top:6px">Trade-offs:<ul>${trades}</ul></div>` : ""}
  </div>`;
}
function render(o){
  lastOutput = o;
  let html = `<div class="card">
    <span class="status ${o.status}">${o.status.toUpperCase()}</span>
    <h3 style="margin-top:10px">${esc(o.summary)}</h3>
    <div class="meta">Architecture style: <b>${esc(o.architecture_style)}</b> &nbsp;|&nbsp; engine v${esc(o.engine_version)}</div>
  </div>`;
  if (o.validation_errors && o.validation_errors.length){
    html += `<div class="card"><h3>Validation errors</h3><ul>${o.validation_errors.map(e=>`<li><code>${esc(e.field)}</code> - ${esc(e.message)}</li>`).join("")}</ul></div>`;
  }
  if (o.stack){
    for (const layer of ["frontend","backend","database","hosting"]) html += componentCard(layer, o.stack[layer]);
    for (const sup of (o.stack.supporting||[])) html += componentCard("supporting: " + sup.layer, sup);
  }
  const c = o.estimated_monthly_cost_usd;
  html += `<div class="card"><div class="layer">Estimated monthly cost</div>
    <div class="cost">$${c.min} - $${c.max} <span class="meta">USD / month</span></div>
    <ul class="meta">${c.assumptions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`;
  if (o.warnings && o.warnings.length){
    html += `<div class="card"><h3>Warnings</h3>${o.warnings.map(w=>
      `<div class="warn ${w.severity}"><b>[${esc(w.severity)}] ${esc(w.code)}</b> ${esc(w.message)}<br>
       <span class="meta">fields: ${(w.fields||[]).map(f=>`<code>${esc(f)}</code>`).join(" ")}</span></div>`).join("")}</div>`;
  }
  if (o.assumptions && o.assumptions.length){
    html += `<div class="card"><h3>Assumptions</h3><ul>${o.assumptions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`;
  }
  html += `<div class="card"><h3>Raw output JSON</h3><pre>${esc(JSON.stringify(o, null, 2))}</pre></div>`;
  $("result").innerHTML = html;
}

$("run").onclick = async () => {
  let scenario;
  try { scenario = JSON.parse($("scenarioText").value); }
  catch(e){ $("result").innerHTML = `<div class="card warn critical">Scenario is not valid JSON: ${esc(e.message)}</div>`; return; }
  const r = await fetch("/api/recommend", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(scenario)});
  render(await r.json());
};

(async () => {
  const q = new URLSearchParams(location.search).get("scenario");
  if (q){
    const r = await fetch("/api/scenario/" + q);
    if (r.ok){ $("scenarioText").value = JSON.stringify(await r.json(), null, 2); $("run").click(); }
  } else {
    const r = await fetch("/api/scenario/P2");
    $("scenarioText").value = JSON.stringify(await r.json(), null, 2);
  }
})();
</script>
</body>
</html>
